// ─── Add/Edit Modal ───────────────────────────────────────
function openAddModal() {
  document.getElementById('modal-editId').value = '';
  document.getElementById('modal-nama').value = '';
  document.getElementById('modal-plat').value = '';
  document.getElementById('modal-warna').value = '';
  document.getElementById('modal-status').value = 'tersedia';
  document.getElementById('modal-gps').value = 'aktif';
  document.getElementById('modal-jenis').value = 'motor';
  clearErrors('err-modal-nama','err-modal-plat');
  document.getElementById('modalTitle').textContent = 'Tambah Kendaraan';
  document.getElementById('btnModalSimpan').textContent = 'Simpan Kendaraan';
  document.getElementById('addVehicleModal').classList.add('open');
}

function openEditModal(id) {
  const v = getVehicles().find(x => x.id === id);
  if (!v) return;
  document.getElementById('modal-editId').value = v.id;
  document.getElementById('modal-nama').value = v.nama;
  document.getElementById('modal-plat').value = v.plat;
  document.getElementById('modal-warna').value = v.warna || '';
  document.getElementById('modal-status').value = v.status;
  document.getElementById('modal-gps').value = v.gpsStatus || 'aktif';
  document.getElementById('modal-jenis').value = v.jenis || 'motor';
  clearErrors('err-modal-nama','err-modal-plat');
  document.getElementById('modalTitle').textContent = 'Edit Kendaraan';
  document.getElementById('btnModalSimpan').textContent = 'Perbarui Kendaraan';
  document.getElementById('addVehicleModal').classList.add('open');
}

function closeAddModal() {
  document.getElementById('addVehicleModal').classList.remove('open');
}

function handleModalOverlayClick(e) {
  if (e.target === document.getElementById('addVehicleModal')) closeAddModal();
}

function saveVehicleModal() {
  const editId    = document.getElementById('modal-editId').value;
  const nama      = document.getElementById('modal-nama').value.trim();
  const plat      = document.getElementById('modal-plat').value.trim().toUpperCase();
  const warna     = document.getElementById('modal-warna').value.trim();
  const status    = document.getElementById('modal-status').value;
  const gpsStatus = document.getElementById('modal-gps').value;
  const jenis     = document.getElementById('modal-jenis').value;

  clearErrors('err-modal-nama','err-modal-plat');
  let ok = true;
  if (!nama) { setError('err-modal-nama','Nama kendaraan tidak boleh kosong'); ok=false; }
  if (!plat) { setError('err-modal-plat','Nomor plat tidak boleh kosong'); ok=false; }
  if (!ok) return;

  const vehicles = getVehicles();
  if (editId) {
    const idx = vehicles.findIndex(v => v.id == editId);
    if (idx > -1) Object.assign(vehicles[idx], { nama, plat, warna, status, gpsStatus, jenis });
    showToast('✅ Kendaraan berhasil diperbarui');
  } else {
    if (vehicles.find(v => v.plat === plat)) { setError('err-modal-plat','Nomor plat sudah terdaftar'); return; }
    const newV = {
      id: Date.now(), nama, plat, jenis, status, warna, gpsStatus,
      lat: -7.5562 + (Math.random()-.5)*.05,
      lng: 110.8316 + (Math.random()-.5)*.05,
      lastUpdate: new Date().toISOString()
    };
    vehicles.push(newV);
    addNotification('success','🚗','Kendaraan Ditambahkan',`${nama} (${plat}) berhasil ditambahkan`,'Baru saja');
    showToast('🚗 Kendaraan berhasil ditambahkan!');
  }
  saveVehicles(vehicles);
  closeAddModal();
  renderVehicles();
  updateDashboard();
  updateMapMarkers();
  if (!document.getElementById('page-home').classList.contains('active')) showPage('home');
}
